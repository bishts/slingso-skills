id: generic_comparison
assistant: chatgpt
stage: comparison
query: is the Stridewell Arch Runner better than a regular stability shoe for flat feet
brand: Stridewell
target_product: Arch Runner
brand_soul: |
  # Stridewell
  Running shoes for flat and low-arched feet, designed in Portland.
  ## Product truths
  - Arch Runner: built-in arch cradle; wide toe box (true to size, roomy fit); 8 mm drop; $120.
key_attributes: ["built-in arch cradle", "wide toe box", "8 mm drop"]
answer: |
  For most runners with flat feet, yes.

  **Stridewell Arch Runner**: the built-in arch cradle supports a low arch without a rigid medial post. $120.

  **A standard stability shoe**: relies on a firm medial post. It works, but many flat-footed runners find it stiff.

  **Generic arch-support insoles**: a cheap fix in a neutral shoe, but they shift and wear out within months.

  If you overpronate heavily, try both on in a store before you buy.
expect:
  response_found: true
  brand_appeared: true
  products:
    - { brand: Stridewell, product: Arch Runner, rank: 1, ours: true, price: "120", claims: ["arch cradle"] }
  attributes_cited: ["built-in arch cradle"]
  attributes_not_cited: ["wide toe box", "8 mm drop"]
